[project]
name = "climate-mining"
version = "0.1.0"
description = "Project 14: Mining nature from the web — search-engine framing of \"climate change\""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "playwright>=1.64.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "simplemma>=2.0.0",
    "thefuzz>=0.22.1",
    "vadersentiment>=3.3.2",
    "wordcloud>=1.9.6",
    "trafilatura",
]

[project.scripts]
collect = "climate_mining.collect:main"
analyze = "climate_mining.analyze:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job
